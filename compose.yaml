name: hitproduct

x-app: &app
  build:
    context: .
  image: hitproduct-api:local
  env_file:
    - .env
  init: true
  restart: unless-stopped
  depends_on:
    redis:
      condition: service_healthy
  extra_hosts:
    - 'host.docker.internal:host-gateway'
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  api:
    <<: *app
    command: ['node', 'src/server.js']
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
      NODE_OPTIONS: --max-old-space-size=240
      LOG_TO_FILE: 'false'
    ports:
      - '${PORT:-3000}:3000'
    mem_limit: 300m
    cpus: 0.75
    stop_grace_period: 15s
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ['node', 'src/worker.js']
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ''
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
      NODE_OPTIONS: --max-old-space-size=112
      LOG_TO_FILE: 'false'
    mem_limit: 150m
    cpus: 0.35
    stop_grace_period: 15s

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --maxmemory
      - 96mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:-local-redis-password}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-local-redis-password}
    ports:
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    mem_limit: 160m
    cpus: 0.25
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep PONG']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  redis_data:
